name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Project sites are served from https://<owner>.github.io/<repo>/.
          BASE_PATH: /${{ github.event.repository.name }}/
          # The catalog-tuned Gemma 4 E2B (LoRA, 32k vocabulary, int8, 2.14 GB) lives on the Hub;
          # with this set the fourth LiteRT model is enabled in the hosted build.
          VITE_TUNED_MODEL_URL: https://huggingface.co/bvoran/gemma-4-e2b-it-a2ui-catalog-litertlm/resolve/main/gemma-4-e2b-it-a2ui-catalog-v32k-int8.litertlm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
